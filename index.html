<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закрытый клуб</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; }

  .header { position: sticky; top: 0; z-index: 100; background: #0f0f0f; border-bottom: 1px solid #222; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #6c63ff, #3ecfcf); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .header-title { font-size: 15px; font-weight: 600; color: #fff; }
  .header-sub { font-size: 11px; color: #666; margin-top: 1px; }

  .refresh-btn { background: #1e1e1e; border: 1px solid #333; color: #aaa; border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
  .refresh-btn:hover { background: #2a2a2a; color: #fff; border-color: #555; }
  .refresh-btn:active { transform: scale(0.96); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .feed { max-width: 600px; margin: 0 auto; padding: 12px 12px 32px; }

  .post { background: #1a1a1a; border: 1px solid #242424; border-radius: 14px; margin-bottom: 12px; overflow: hidden; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .post-media { width: 100%; max-height: 360px; object-fit: cover; display: block; background: #222; }
  .post-body { padding: 14px; }
  .post-text { font-size: 14px; line-height: 1.6; color: #ddd; white-space: pre-wrap; word-break: break-word; }
  .post-text a { color: #6c9eff; text-decoration: none; }
  .post-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #242424; }
  .post-date { font-size: 11px; color: #555; }
  .post-views { font-size: 11px; color: #555; display: flex; align-items: center; gap: 4px; }
  .watermark { font-size: 10px; color: #2a2a2a; margin-top: 6px; font-family: monospace; user-select: none; }

  .skeleton { background: #1a1a1a; border: 1px solid #242424; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .skeleton-img { width: 100%; height: 180px; background: #222; animation: shimmer 1.4s infinite; }
  .skeleton-lines { padding: 14px; }
  .skeleton-line { height: 12px; border-radius: 6px; background: #222; margin-bottom: 8px; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .load-more { text-align: center; padding: 16px; }
  .load-more-btn { background: #1e1e1e; border: 1px solid #333; color: #aaa; border-radius: 10px; padding: 10px 24px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .load-more-btn:hover { background: #2a2a2a; color: #fff; }

  .empty { text-align: center; padding: 60px 20px; color: #555; }
  .empty p { font-size: 14px; line-height: 1.8; }

  .error-banner { background: #2a1a1a; border: 1px solid #5a2a2a; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 13px; color: #ff8080; line-height: 1.5; }

  .progress-bar { height: 2px; background: #222; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #6c63ff, #3ecfcf); border-radius: 2px; transition: width 0.3s; }

  .preloading-badge { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: #555; padding: 8px; }
  .preloading-dot { width: 5px; height: 5px; border-radius: 50%; background: #6c63ff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-avatar">З</div>
    <div>
      <div class="header-title">Закрытый клуб</div>
      <div class="header-sub" id="post-count">Загрузка...</div>
      <div style="font-size:9px;color:#555;margin-top:1px;letter-spacing:0.05em;">v1</div>
    </div>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="refreshFeed()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    Обновить
  </button>
</div>

<div class="feed" id="feed"></div>

<script>
const TOKEN = '8662130516:AAFJnnKvralhkb-Q0TJDeXBDcP9ZLBJZnWM';
const CHANNEL = '@BotJustBest';
const MAX_MSG_ID = 69;
const PAGE_SIZE = 5;
const PRELOAD_SIZE = 5;
const BASE = `https://api.telegram.org/bot${TOKEN}`;

const USER_ID = (typeof Telegram !== 'undefined' && Telegram.WebApp?.initDataUnsafe?.user?.id) || 'DEMO';
const WM = '\u200b\u200c\u200b\u200d\u200c\u200b';

let allPosts = [];
let shown = 0;
let preloaded = [];
let isLoading = false;

// Получаем посты перебором message_id через forwardMessages
async function fetchAllPosts() {
  const posts = [];
  const BATCH = 10;

  // Сначала пробуем forwardMessages батчами
  for (let start = 1; start <= MAX_MSG_ID; start += BATCH) {
    const ids = [];
    for (let i = start; i < start + BATCH && i <= MAX_MSG_ID; i++) ids.push(i);

    try {
      const r = await fetch(`${BASE}/forwardMessages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TOKEN.split(':')[0], // пересылаем боту самому себе (его user_id)
          from_chat_id: CHANNEL,
          message_ids: ids,
          disable_notification: true
        })
      });
      const d = await r.json();
      if (d.ok && d.result) {
        for (const msg of d.result) {
          if (msg && (msg.text || msg.photo || msg.video || msg.caption)) {
            posts.push({ ...msg, original_id: msg.forward_origin?.message_id });
          }
        }
      }
    } catch(e) {}

    // Небольшая пауза чтобы не превысить лимиты
    await new Promise(r => setTimeout(r, 300));
  }

  // Если forwardMessages не сработал — пробуем copyMessage по одному
  if (!posts.length) {
    for (let id = MAX_MSG_ID; id >= 1; id--) {
      try {
        const r = await fetch(`${BASE}/copyMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TOKEN.split(':')[0],
            from_chat_id: CHANNEL,
            message_id: id,
            disable_notification: true
          })
        });
        const d = await r.json();
        if (d.ok) posts.push({ message_id: d.result.message_id, _original_id: id });
      } catch(e) {}
      await new Promise(r => setTimeout(r, 100));
    }
  }

  return posts.sort((a, b) => b.message_id - a.message_id);
}

// Альтернатива: читаем пересланные сообщения из чата бота с собой
async function fetchViaGetUpdates() {
  const r = await fetch(`${BASE}/getUpdates?limit=100&offset=-100`);
  const d = await r.json();
  if (!d.ok) throw new Error(d.description);

  const posts = d.result
    .filter(u => (u.channel_post || u.message?.forward_origin))
    .map(u => u.channel_post || u.message)
    .filter(Boolean);

  return posts.sort((a, b) => b.date - a.date);
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(t) {
  if (!t) return '';
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatText(text, entities) {
  if (!text) return '';
  if (!entities?.length) return escapeHtml(text);
  const chars = [...text];
  let result = '', i = 0;
  const ents = [...entities].sort((a,b) => a.offset - b.offset);
  let ei = 0;
  while (i < chars.length) {
    if (ei < ents.length && i === ents[ei].offset) {
      const e = ents[ei];
      const chunk = chars.slice(e.offset, e.offset + e.length).join('');
      if (e.type === 'text_link') result += `<a href="${escapeHtml(e.url)}" target="_blank">${escapeHtml(chunk)}</a>`;
      else if (e.type === 'url') result += `<a href="${escapeHtml(chunk)}" target="_blank">${escapeHtml(chunk)}</a>`;
      else if (e.type === 'bold') result += `<b>${escapeHtml(chunk)}</b>`;
      else if (e.type === 'italic') result += `<i>${escapeHtml(chunk)}</i>`;
      else result += escapeHtml(chunk);
      i += e.length; ei++;
    } else { result += escapeHtml(chars[i]); i++; }
  }
  return result;
}

async function getFileUrl(file_id) {
  try {
    const r = await fetch(`${BASE}/getFile?file_id=${file_id}`);
    const d = await r.json();
    if (d.ok) return `https://api.telegram.org/file/bot${TOKEN}/${d.result.file_path}`;
  } catch(e) {}
  return null;
}

async function renderPost(post) {
  const div = document.createElement('div');
  div.className = 'post';
  let mediaHtml = '';

  if (post.photo) {
    const photo = post.photo[post.photo.length - 1];
    const url = await getFileUrl(photo.file_id);
    if (url) mediaHtml = `<img class="post-media" src="${url}" loading="lazy" alt="фото">`;
  } else if (post.video) {
    const url = await getFileUrl(post.video.file_id);
    if (url) mediaHtml = `<video class="post-media" src="${url}" controls preload="none"></video>`;
  }

  const text = post.text || post.caption || '';
  const entities = post.entities || post.caption_entities;
  const textHtml = formatText(text, entities);
  const views = post.views ? `<span class="post-views"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${post.views.toLocaleString('ru-RU')}</span>` : '';

  div.innerHTML = `
    ${mediaHtml}
    <div class="post-body">
      ${textHtml ? `<div class="post-text">${textHtml}</div>` : ''}
      <div class="post-meta">
        <span class="post-date">${formatDate(post.date)}</span>
        ${views}
      </div>
      <div class="watermark">${WM}${USER_ID}</div>
    </div>
  `;
  return div;
}

function renderSkeletons(n = 3) {
  const feed = document.getElementById('feed');
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'skeleton';
    s.innerHTML = `<div class="skeleton-img"></div><div class="skeleton-lines"><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:55%"></div><div class="skeleton-line" style="width:35%"></div></div>`;
    feed.appendChild(s);
  }
}

function clearSkeletons() { document.querySelectorAll('.skeleton').forEach(s => s.remove()); }

async function preloadBatch(posts) {
  const batch = [];
  for (const post of posts) batch.push(await renderPost(post));
  return batch;
}

async function showNextBatch() {
  if (isLoading) return;
  isLoading = true;
  const feed = document.getElementById('feed');
  feed.querySelector('.load-more')?.remove();

  const badge = document.createElement('div');
  badge.className = 'preloading-badge';
  badge.innerHTML = `<div class="preloading-dot"></div>Подготовка постов с водяными знаками...`;
  feed.appendChild(badge);

  let toShow = [];
  if (preloaded.length > 0) {
    toShow = preloaded.splice(0, PAGE_SIZE);
  } else {
    toShow = await preloadBatch(allPosts.slice(shown, shown + PAGE_SIZE));
  }
  badge.remove();

  for (const el of toShow) feed.appendChild(el);
  shown += toShow.length;

  const nextBatch = allPosts.slice(shown, shown + PRELOAD_SIZE);
  if (nextBatch.length > 0) preloadBatch(nextBatch).then(els => { preloaded = els; });

  if (shown < allPosts.length) {
    const loadMore = document.createElement('div');
    loadMore.className = 'load-more';
    loadMore.innerHTML = `<button class="load-more-btn" onclick="showNextBatch()">Показать ещё (${allPosts.length - shown})</button>`;
    feed.appendChild(loadMore);
  }

  isLoading = false;
}

async function init() {
  const feed = document.getElementById('feed');
  const countEl = document.getElementById('post-count');
  feed.innerHTML = '';
  renderSkeletons(3);

  try {
    // Сначала пробуем getUpdates (новые посты)
    let posts = await fetchViaGetUpdates();

    // Если мало постов — пробуем forwardMessages для истории
    if (posts.length < 3) {
      countEl.textContent = 'Загружаю историю...';
      posts = await fetchAllPosts();
    }

    clearSkeletons();

    if (!posts.length) {
      countEl.textContent = 'Нет постов';
      feed.innerHTML = `<div class="empty"><p>Постов пока нет.<br>Опубликуй новый пост в канале<br>и нажми Обновить.</p></div>`;
      return;
    }

    allPosts = posts;
    countEl.textContent = `${allPosts.length} публикаций`;
    shown = 0; preloaded = [];
    await showNextBatch();

  } catch(e) {
    clearSkeletons();
    countEl.textContent = 'Ошибка';
    feed.innerHTML = `<div class="error-banner">Ошибка: ${e.message}</div>`;
  }
}

async function refreshFeed() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning'); btn.disabled = true;
  await init();
  btn.classList.remove('spinning'); btn.disabled = false;
}

if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

init();
</script>
</body>
</html>
